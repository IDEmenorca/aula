# =============================================================================
# Aula IDE Menorca — configuració de MkDocs
# Consell Insular de Menorca · Departament de Cartografia
# =============================================================================

site_name: Aula IDE Menorca
site_description: >-
  Portal de formació en Infraestructures de Dades Espacials del Consell Insular
  de Menorca. Cursos i guies sobre l'IDE Menorca i el seu visor cartogràfic.
site_author: Consell Insular de Menorca · Departament de Cartografia
copyright: >-
  © Consell Insular de Menorca · Departament de Cartografia

# -----------------------------------------------------------------------------
# <PENDENT: confirmar> — subdomini definitiu del lloc publicat.
# S'hi ha posat el valor assumit (formacio.ide.cime.es) perquè MkDocs valida
# site_url com una URL real i un marcador de text faria fallar la construcció.
# D'aquí surten els enllaços canònics i el sitemap.xml. Mentre el domini propi
# no estigui configurat, el lloc se serveix des d'idemenorca.github.io/aula/.
# Si canvia el subdomini, cal actualitzar-lo aquí i a Settings → Pages del
# repositori (no hi ha cap fitxer CNAME: vegeu DEPLOY.md).
# -----------------------------------------------------------------------------
site_url: https://formacio.ide.cime.es/

repo_url: https://github.com/IDEmenorca/aula
repo_name: IDEmenorca/aula
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: ca

  # Logotip de la capçalera i icona de pestanya (l'original de cartografia.cime.es).
  # Excepció a la regla d'imatges: docs/assets/ és per a elements del lloc
  # (logotip, icones), no per a captures de contingut, que van a l'img/ de cada secció.
  logo: assets/logo.png
  favicon: assets/logo.png

  palette:
    # Mode clar
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      # L'accent tenyeix enllaços i elements interactius. Sobre fons blanc, el
      # verd llima del logotip no arriba al contrast mínim exigible a una web
      # pública, per això aquí s'usa un verd fosc i el llima es reserva al mode fosc.
      accent: green
      toggle:
        icon: material/weather-night
        name: Canvia al mode fosc
    # Mode fosc
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Canvia al mode clar
  features:
    - navigation.sections      # agrupa les seccions al menú lateral
    - navigation.top           # botó "torna a dalt"
    - navigation.tabs          # pestanyes per a les seccions de primer nivell
    - navigation.tracking      # l'URL segueix l'apartat que es va llegint
    - navigation.footer        # enllaços a la pàgina anterior i la següent, al peu
    - toc.integrate            # l'índex de la pàgina va al menú esquerre, no a un de dret
    - navigation.instant       # navegació sense recàrrega de pàgina
    - content.action.edit      # botó "edita aquesta pàgina" (usa edit_uri)
    - content.code.copy        # botó de còpia als blocs de codi
    - search.suggest           # suggeriments mentre s'escriu al cercador
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/progres.js

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://ide.cime.es
      name: IDE Menorca

# -----------------------------------------------------------------------------
# Extensions de Markdown
# -----------------------------------------------------------------------------
markdown_extensions:
  - admonition                 # blocs !!! note, !!! warning, etc.
  - attr_list                  # atributs {: .classe } — necessari per a les graelles
  - md_in_html                 # Markdown dins de blocs HTML (iframes, targetes)
  - footnotes
  - toc:
      permalink: true
      permalink_title: Enllaç permanent a aquesta secció
  - pymdownx.details           # admonitions plegables
  - pymdownx.keys              # tecles del teclat: ++esc++ → Esc
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  # Caselles per marcar als exercicis. clickable_checkbox les fa pitjables;
  # el que es marca NO es desa enlloc i es perd en recarregar la pàgina.
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# -----------------------------------------------------------------------------
# Connectors
# -----------------------------------------------------------------------------
plugins:
  - search:
      # lunr-languages no té fitxer per al català (comprovat a la versió 1.22:
      # hi ha es, fr, it, pt... però cap ca). <A REVISAR> si algun dia n'hi ha.
      #
      # Compte amb què fa realment aquesta opció aquí: el "pipeline" per
      # defecte d'aquest tema només aplica stopWordFilter, NO stemmer. O sigui
      # que triar castellà no arrela les paraules; només fa servir la llista
      # castellana de mots buits. Té un parell d'efectes secundaris sobre text
      # català ("sobre", "contra" i "entre" queden fora de l'índex perquè són
      # mots buits en castellà) i no elimina els mots buits catalans que no
      # existeixen en castellà (amb, els, per, tot...).
      #
      # Es manté en castellà perquè, si algun dia el lloc és bilingüe, les
      # pàgines en castellà sí que en treuran profit.
      lang: es

      # Els apòstrofs HAN de separar paraules. El separador per defecte és
      # només [\s\-], i en català això vol dir que "l'extensió" s'indexa com
      # un únic terme: qui cerqui "extensió" no la troba. Afectava 172 termes
      # de l'índex. Vegeu DEPLOY.md si cal tornar-hi.
      separator: '[\s\-''’]+'
  - glightbox                  # ampliació de les captures de pantalla
  - git-revision-date-localized:
      locale: ca
      type: date
      # Només la data de darrera actualització: la de creació no aporta res
      # a qui llegeix i dobla la línia del peu.
      enable_creation_date: false
      # Evita que la construcció falli en clons superficials o fora de Git.
      # A CI el checkout fa fetch-depth: 0, per tant s'hi usen dates reals.
      fallback_to_build_date: true

# -----------------------------------------------------------------------------
# Navegació — definida explícitament; no depèn de l'ordre alfabètic dels fitxers
# -----------------------------------------------------------------------------
